plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hadimoradogt.hadinetscan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hadimoradogt.hadinetscan'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("HADIVPN_KEYSTORE_FILE")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv("HADIVPN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HADIVPN_KEY_ALIAS")
                keyPassword System.getenv("HADIVPN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("HADIVPN_KEYSTORE_FILE") != null && !System.getenv("HADIVPN_KEYSTORE_FILE").isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
